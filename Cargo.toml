[package]
name = "anymirror"
version = "0.4.0"
edition = "2024"
description = "High-performance traffic orchestration gateway with transparent L3 proxying and rule-based request routing"

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "http2", "tokio", "query"] }
base64 = "0.22"
bytes = "1.10.1"
cfonts = "1.3.0"
clap = { version = "4", default-features = false, features = ["derive", "std", "help"] }
etherparse = { version = "0.19", default-features = false, features = ["std"] }
futures = "0.3"
hickory-proto = "0.25"
hickory-resolver = { version = "0.25", features = ["https-ring", "tls-ring"] }
hickory-server = "0.25"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = [
    "client-legacy",
    "http1",
    "http2",
    "server-auto",
    "server-graceful",
    "tokio",
    "server",
] }
ipnet = "2"
mime_guess = "2"
netstack-smoltcp = "0.2"
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
pin-project-lite = "0.2"
rcgen = { version = "0.14", features = ["pem", "aws_lc_rs"] }
rquickjs = { version = "0.11", features = ["loader"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = { version = "0.10", package = "yaml_serde", default-features = false }
socket2 = "0.6.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "io-util", "net", "time", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tun-rs = { version = "2.8", features = ["async", "async_framed"] }
url = { version = "2.5", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windivert = { version = "0.6.0", features = ["vendored"] }
windivert-sys = { version = "0.10.0", features = ["vendored"] }
windows-legacy = { package = "windows", version = "0.48.0", features = ["Win32_Foundation"] }

[patch.crates-io]
c2rust-bitfields = { path = "vendor/c2rust-bitfields" }
c2rust-bitfields-derive = { path = "vendor/c2rust-bitfields-derive" }

[dev-dependencies]
tempfile = "3"

# https://github.com/microsoft/edit/blob/main/Cargo.toml
# We use `opt-level = "s"` as it significantly reduces binary size.
# We could then use the `#[optimize(speed)]` attribute for spot optimizations.
# Unfortunately, that attribute currently doesn't work on intrinsics such as memset.
[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times

[profile.bench]
codegen-units = 16          # Make compiling criterion faster (16 is the default, but profile.release sets it to 1)
lto = "thin"                # Similarly, speed up linking by a ton
