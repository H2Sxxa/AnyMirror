[package]
name = "anymirror"
version = "0.3.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1.89"
axum = { version = "0.8", default-features = false, features = ["json", "http2", "tokio", "query"] }
cfonts = "1.3.0"
clap = { version = "4.6.0", default-features = false, features = ["derive", "std", "help"] }
etherparse = { version = "0.19.0", default-features = false, features = ["std"] }
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.3", features = [
    "server-auto",
    "tokio",
    "server",
] }
ipnet = "2.11.0"
rcgen = { version = "0.14", features = ["pem"] }
rustls = { version = "0.23.37", features = ["ring"] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = { version = "0.9", default-features = false }
socket2 = "0.5.10"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", default-features = false, features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hickory-proto = "0.25.2"
hickory-resolver = { version = "0.25.2", features = ["https-ring", "tls-ring"] }
hickory-server = "0.25.2"
url = { version = "2.5", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windivert = { version = "0.6.0", features = ["vendored"] }
windivert-sys = { version = "0.10.0", features = ["vendored"] }
windows = { version = "0.48.0", features = ["Win32_Foundation"] }

# https://github.com/microsoft/edit/blob/main/Cargo.toml
# We use `opt-level = "s"` as it significantly reduces binary size.
# We could then use the `#[optimize(speed)]` attribute for spot optimizations.
# Unfortunately, that attribute currently doesn't work on intrinsics such as memset.
[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # No one needs an undebuggable release binary
lto = true                  # reduces binary size by ~14%
opt-level = "s"             # reduces binary size by ~25%
panic = "abort"             # reduces binary size by ~50% in combination with -Zbuild-std-features=panic_immediate_abort
split-debuginfo = "packed"  # generates a separate *.dwp/*.dSYM so the binary can get stripped
strip = "symbols"           # See split-debuginfo - allows us to drop the size by ~65%
incremental = true          # Improves re-compile times

[profile.bench]
codegen-units = 16          # Make compiling criterion faster (16 is the default, but profile.release sets it to 1)
lto = "thin"                # Similarly, speed up linking by a ton
